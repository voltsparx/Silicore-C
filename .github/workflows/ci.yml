name: ci

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libcurl4-openssl-dev libssl-dev nlohmann-json3-dev
      - name: Configure
        run: cmake --preset linux-release-tests
      - name: Build
        run: cmake --build --preset linux-release-tests
      - name: Test
        run: ctest --preset linux-release-tests
